spring.application.name=backsanta
server.port=7070
logging.file.name=backsanta.log
#spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

file-service.base-url=http://localhost:7070
file-service.base-dir=/mnt/d/Downloads
# Long enough for large file streams (StreamingResponseBody runs async)
spring.mvc.async.request-timeout=30m
